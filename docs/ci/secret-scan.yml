# PROPOSAL: move to .github/workflows/secret-scan.yml. Not active while it lives under docs/ci/.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO(pin): replace the tag with the verified commit sha for actions/checkout v4
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # TODO(pin): replace the tag with the verified commit sha for actions/setup-python v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan every tracked file for credentials (exits 1 on any hit)
        run: python3 bin/guard.py

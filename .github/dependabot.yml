version: 2
updates:
  # The workflow's own actions (checkout, setup-python, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # The npm wrapper in packaging/npm. The folders under fixtures/ are test inputs, not dependencies of Quarterdeck, so they are left out on purpose.
  - package-ecosystem: npm
    directory: /packaging/npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

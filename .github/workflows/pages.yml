name: pages

# Publishes site/ to GitHub Pages, with the docs pages built from the repository's markdown files. It runs only when the site, its build script or one of those files changes on main.
# One-time setup by the owner: Settings > Pages > Source: GitHub Actions, then the custom domain.
on:
  push:
    branches: [main]
    paths: ['site/**', 'packaging/site/**', 'SETUP.md', 'GUIDE.md', 'SECURITY.md', 'THREAT-MODEL.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the docs pages (written into site/docs, never committed)
        run: |
          pip install 'markdown==3.7'
          python packaging/site/build_docs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

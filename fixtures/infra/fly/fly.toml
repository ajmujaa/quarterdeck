# FIXTURE: invented. No real organization.
app = "shop-production"
primary_region = "ams"

[env]
DATABASE_URL = "postgres://admin:fixturepw@db.example.com:5432/shop"
SECRET_KEY_BASE = "fixture-secret-key-base"

[deploy]
release_command = "bin/migrate --drop-unused"

[mounts]
source = "shop_data"
destination = "/data2"

[http_service]
internal_port = 8080
auto_stop_machines = "suspend"
min_machines_running = 0

[[services]]
internal_port = 5432
protocol = "tcp"
  [[services.ports]]
  port = 5432

[[services]]
internal_port = 8080
protocol = "tcp"
  [[services.ports]]
  port = 80

[[vm]]
size = "performance-8x"
